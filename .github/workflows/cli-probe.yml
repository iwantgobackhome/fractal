name: AI CLI install and detection

on:
  push:
    branches: ['fix/**', 'release/**']
    paths:
      - 'packages/hub/src/ai/**'
      - 'packages/hub/src/codex/runtime.ts'
      - 'apps/desktop/main.cjs'
      - 'scripts/cli-probe.mts'
      - '.github/workflows/cli-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci
      - run: npm run build -w @fractal/shared
      - name: Use a per-user npm prefix (Linux)
        if: runner.os == 'Linux'
        run: npm config set prefix "$HOME/.npm-global"
      - name: Install both CLIs with the Hub installer
        run: npx tsx scripts/cli-probe.mts install
      - name: Detect both CLIs from a desktop-launch PATH
        run: npx tsx scripts/cli-probe.mts detect
